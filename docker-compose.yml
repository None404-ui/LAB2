version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: lab2-postgres
    environment:
      POSTGRES_DB: laba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laba"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab2-network

  # Spring Boot приложение + React frontend
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: lab2-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/laba
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - lab2-network
    restart: unless-stopped

networks:
  lab2-network:
    driver: bridge

volumes:
  postgres_data:
